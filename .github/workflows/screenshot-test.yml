name: Screenshot test
# 主要畫面自動截圖測試（生態系統功能 screenshot_test，杜杜龍 2026-11-27）：
# 每天用 Playwright 以手機 390px 截公開頁面，和上次比對，有差異才開 Issue 通知。不耗 AI 額度。
# 頁面清單在 .github/screenshots.json；只放不用登入的公開頁面。
on:
  schedule:
    - cron: "0 1 * * *"   # 台北時間 09:00
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: screenshot-test
  cancel-in-progress: false

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install tools (not saved into the project)
        run: |
          mkdir -p "$RUNNER_TEMP/shot-tools"
          cd "$RUNNER_TEMP/shot-tools"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright pngjs pixelmatch
          npx playwright install --with-deps chromium
      - name: Restore previous screenshots
        uses: actions/cache/restore@v4
        with:
          path: .shots-prev
          key: shots-none
          restore-keys: shots-
      - name: Take screenshots and compare
        run: |
          mkdir -p .shots-prev
          node scripts/screenshot-test.mjs .github/screenshots.json .shots-out .shots-prev
        env:
          SHOT_TOOLS: ${{ runner.temp }}/shot-tools
      - name: Open an Issue when something changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          problems=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.shots-out/report.json','utf8')).problems)")
          if [ "$problems" != "0" ]; then
            body=$(node -e "const r=JSON.parse(require('fs').readFileSync('.shots-out/report.json','utf8'));console.log(r.results.filter(x=>x.status==='changed'||x.status==='failed').map(x=>'- '+x.name+'（'+x.url+'）：'+(x.status==='failed'?'截圖失敗 '+(x.error||''):'畫面與上次相差 '+x.diff_percent+'%')).join('\n'))")
            gh label create screenshot-diff --color FBCA04 --description "截圖測試發現差異" 2>/dev/null || true
            gh issue create --title "截圖測試：主要畫面有變化（$(date -u +%Y-%m-%d)）" --label screenshot-diff \
              --body "$body

這是自動截圖測試（手機 390px）。差異若是預期的改版就不用處理；看起來不對請告訴 AI「繼續處理截圖測試的 Issue」。截圖與差異圖在這次執行的 Artifacts：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
      - name: Keep screenshots as the new baseline
        run: rm -rf .shots-prev && mkdir .shots-prev && cp .shots-out/*.png .shots-prev/ 2>/dev/null && rm -f .shots-prev/*.diff.png || true
      - uses: actions/cache/save@v4
        with:
          path: .shots-prev
          key: shots-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: .shots-out
          retention-days: 14
